server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/lumina-dev.access.log;
    error_log /var/log/nginx/lumina-dev.error.log warn;

    location / {
        proxy_pass http://mock-api:5678;
        proxy_set_header Host luminaintranet.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        proxy_pass http://mock-api:5678;
    }
}

# Valeurs de reference conservees pour rester proches de l'ancienne passerelle
# du bureau. La vraie limite de confiance etait portee par le frontal de
# production.
geo $lumina_office_network {
    default 0;
    192.168.10.0/24 1;
}
