services:
  app:
    image: nginx:1.27-alpine
    container_name: lumina-tools-app
    environment:
      INTRANET_URL: ${INTRANET_URL}
      INTRANET_USERNAME: ${INTRANET_USERNAME}
    ports:
      - "8080:80"
    volumes:
      - ./config:/etc/nginx/conf.d:ro

  mock-api:
    image: hashicorp/http-echo:1.0
    container_name: lumina-mock-api
    command:
      - "-listen=:5678"
      - "-text=lumina dev tools mock api"
    ports:
      - "5678:5678"

networks:
  default:
    name: lumina-dev-net
